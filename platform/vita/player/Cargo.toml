# Profile rustflags (nightly, as the Vita build already is) apply on top of
# the RUSTFLAGS cargo-vita sets.
cargo-features = ["profile-rustflags"]

[package]
name = "siglus_vita_player"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
build = "build.rs"

[workspace]

# LLVM's SLP vectorizer pairs neighbouring 64-bit saturating operations
# (x/y coordinates, times) into NEON `vqadd.s64`/`vqsub.s64`. The Vita's
# CPU runs them, but Vita3K cannot, and computes wrong values instead:
# clicks miss their buttons and the player dies during the opening. Loop
# vectorization (pixel loops) stays on.
[profile.release]
rustflags = ["-C", "no-vectorize-slp"]

[profile.dev]
rustflags = ["-C", "no-vectorize-slp"]

[package.metadata.vita]
title_id = "SIGVITA02"
title_name = "Siglus Vita"
build_std = "std,panic_abort"

[target.'cfg(target_os = "vita")'.dependencies]
siglus_scene_vm = { path = "../../../crates/siglus_scene_vm" }
vitasdk-sys = { version = "=0.3.3", default-features = false, features = ["SceAudio_stub", "SceCtrl_stub", "SceSysmem_stub", "SceTouch_stub", "SceCommonDialog_stub"] }
