[workspace]
resolver = "3"
members = [
  "crates/*",
]
exclude = ["vendor/eluna_rs"]

[workspace.package]
edition = "2024"
license = "MPL-2.0"

[profile.release]
# Reduce distribution size while retaining optimization for runtime performance.
strip = true
lto = "thin"
codegen-units = 1
opt-level = 3

[workspace.lints.rust]
unused = "allow"
non_upper_case_globals = "allow"

[workspace.lints.clippy]
erasing_op = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"
identity_op = "allow"
explicit_counter_loop = "allow"
precedence = "allow"
misrefactored_assign_op = "allow"

[workspace.dependencies]
anyhow = { version = "1", default-features = false }
clap = { version = "4", features = ["derive"] }
bytemuck = { version = "1", features = ["derive"] }
wgpu = { version = "0.20", features = ["wgsl"] }
winit = "=0.31.0-beta.3"
pollster = "0.3"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "bmp", "dds"] }
log = "0.4"
env_logger = "0.11"
kira = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
