<h1> 名前フラグを設定／取得する</h1>

<p>名前フラグの扱いは少し特殊です。
</p>
<h4> 名前フラグの値を設定する</h4>

<pre class="source">
namae("％Ａ") = "しぐらす"
</pre>

<h4> 名前フラグの値を取得する</h4>

<pre class="source">
s[0] = namae("％Ａ")
</pre>

<p>名前は、エディットボックスなどでプレイヤーが入力できると便利です。
マニュアルの <a href="../../スクリプトマニュアル/入力制御/エディットボックス.html">エディットボックス</a> やサンプルを参照し、上手く作って下さい。
</p>
