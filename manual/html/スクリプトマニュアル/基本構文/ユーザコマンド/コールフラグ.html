<h1> コールフラグ</h1>

<p>ユーザコマンドを呼び出した場合も、コールフラグが作られます。
</p>
<pre class="source">
command $plus(property $a : int, property $b : int) : int
{
    l[0] = $a + $b

    return(l[0])
}
