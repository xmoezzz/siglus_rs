<h1> 整数</h1>

<h4> 整数</h4>

<p>整数は int 型のエレメントです。
Siglus では -2147483648 ～ 2147483647 までの整数を扱えます。
小数や分数を扱うことはできません。
</p>
<h4> １０進数、１６進数、２進数</h4>

<p>Siglus では１０進数の他に、１６進数、２進数が扱えます。
16進数は 0x???、2進数は 0b???、と書きます。
</p>
<div class="table-container">
<table>
<tr><td>表記</td><td>値</td></tr>
<tr><td>100</td><td>100（10進数）</td></tr>
<tr><td><font color="red">0x</font>FF</td><td>255（16進数）</td></tr>
<tr><td><font color="red">0b</font>1000</td><td>8（2進数）</td></tr>
</table>
</div>
