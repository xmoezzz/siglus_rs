<h1> ユーザコマンド内でユーザフラグを作る</h1>

<h5> ５月１４日.ss</h5>

<pre class="source">
#z00

$hello

owari

command $hello
{
    property $i

    for ($i = 0, $i < 3, $i += 1){
        こんにちは！r
    }
}
</pre>

<h5> 実行結果</h5>

<pre class="result">
こんにちは！
こんにちは！
こんにちは！
</pre>
