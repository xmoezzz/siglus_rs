<h1> 汎用フラグ</h1>

<h4> 汎用フラグ</h4>

<pre class="exp">
front.object[0].f
</pre>

<p>汎用フラグです。自由に使って下さい。
</p>
<p>汎用フラグを使うには、汎用フラグを確保する必要があります。

</p>
<h4> 汎用フラグを使った例</h4>

<pre class="source">
front.object[0].f.resize(10)  <span class="comment">// オブジェクト０番の汎用フラグを１０個確保する</span>

</pre>
