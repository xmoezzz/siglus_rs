<h1> オブジェクトトーンカーブ</h1>

<p>オブジェクトにトーンカーブを設定できます。
詳しくは <a href="../../スクリプトマニュアル/演出/トーンカーブ.html">トーンカーブ</a> を参照して下さい。
</p>
<h4> トーンカーブ番号を指定する</h4>

<pre class="exp">
// オブジェクトのトーンカーブを０番に設定する
front.object[0].tonecurve_no = 0

// オブジェクトのトーンカーブを初期化する
front.object[0].tonecurve_no = -1
