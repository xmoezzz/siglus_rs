<h1> メッセージウィンドウパラメータ</h1>

<h4> 子供オブジェクト</h4>

<pre class="exp">
front.mwnd[0].object
</pre>

<p>メッセージウィンドウも子供としてオブジェクトを持っています。
個数は <a href="../../設定ファイル/メッセージウィンドウ枠の設定.html">メッセージウィンドウ枠の設定</a> で設定します。変更はできません。
オブジェクトについては <a href="../../スクリプトマニュアル/オブジェクト/オブジェクト.html">オブジェクト</a> を参照して下さい。
</p>
<h4> ワールドを指定する</h4>

<pre class="exp">
front.mwnd[0].world = 0
</pre>

<h4> レイヤー値を指定する</h4>

<pre class="exp">
front.mwnd[0].layer = 0
</pre>
