<h1> 文字を装飾する</h1>

<h4> 文字サイズを変更する</h4>

<pre class="exp">
size($size)      // 文字サイズを設定する
size             // 文字サイズを初期設定に戻す
</pre>

<h4> 文字の色を変更する</h4>

<pre class="exp">
color($color_no) // 文字色を設定する
color            // 文字色を初期設定に戻す
</pre>

<p>色は、Gameexe.ini で作成した COLOR_TABLE の番号を設定します。
<a href="../../設定ファイル/カラーテーブルの設定.html">カラーテーブルの設定</a> を参照して下さい。
</p>
