[package]
name = "siglus_assets"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"

[features]
default = []
nfs = ["dep:game-network", "game-network/nfs"]
smb = ["dep:game-network", "game-network/smb"]

[dependencies]
game-network = { path = "../game-network", optional = true, default-features = false }
anyhow = "1"
encoding_rs = "0.8"
hex = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
image.workspace = true
lewton = { version = "0.10", default-features = true }
na_mpeg2_decoder = { path = "../na_mpeg2_decoder" }

[lints]
workspace = true
