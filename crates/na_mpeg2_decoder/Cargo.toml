[package]
name = "na_mpeg2_decoder"
version = "0.1.0"
edition.workspace = true
description = "Rust MPEG-1/2 video decoder"

[lib]
name = "na_mpeg2_decoder"
path = "src/lib.rs"

[dependencies]
thiserror = "1"
log = "0.4"
byteorder = "1"

# MP1/2/3 uses Symphonia; DVD private AC-3 uses oxideav-ac3.
# Do not pin the early 0.0.2 git snapshot: its AC-3 bit-allocation approximation
# can exhaust mantissa bits and zero-fill otherwise valid audio blocks. Use the
# conformance-tested release instead. No FFmpeg or native C decoder is used.
symphonia = { version = "0.5.5", default-features = false, features = ["mpa"] }
oxideav-ac3 = "0.0.10"
# oxideav-ac3 0.0.10 uses oxideav_core::register!, which is unavailable in
# the old oxideav-core 0.1.7 retained by this workspace lockfile. Pin the
# compatible core generation explicitly so Cargo cannot keep resolving 0.1.7.
oxideav-core = "=0.1.29"

crossbeam-channel = { version = "0.5", optional = true }
pollster = { version = "0.3", optional = true }
winit = { version = "0.29", features = ["rwh_05"], optional = true }

wgpu = { version = "=30.0.1", optional = true }
bytemuck = { version = "1" }
rodio = { version = "0.17", optional = true }
env_logger = { version = "0.11", optional = true }
png = { version = "0.17", optional = true }


[features]
desktop-bins = [
  "dep:crossbeam-channel",
  "dep:pollster",
  "dep:winit",
  "dep:wgpu",
  "dep:rodio",
  "dep:env_logger",
  "dep:png",
]

[[bin]]
name = "mpeg2_player_wgpu"
path = "src/bin/mpeg2_player_wgpu.rs"
required-features = ["desktop-bins"]

[lints]
workspace = true
